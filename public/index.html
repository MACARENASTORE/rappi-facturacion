<!DOCTYPE html>
<html>
<head>
  <title>MacarenaStore Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #f5f6fa;
      margin: 0;
    }

    .container {
      padding: 30px;
    }

    h1 {
      color: #2f3640;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    button {
      padding: 10px 20px;
      border: none;
      background: #273c75;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    canvas {
      max-width: 100%;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🚀 MacarenaStore Panel</h1>

  <div class="card">
    <h2>📤 Subir CSV</h2>
    <form action="/upload" method="post" enctype="multipart/form-data">
      <input type="file" name="file" required><br><br>
      <button type="submit">Subir archivo</button>
    </form>
  </div>

  <div class="card">
    <h2>🧾 Facturación</h2>
    <button onclick="procesar()">Facturar ahora</button>
  </div>

  <div class="card">
    <h2>📊 Resultado</h2>
    <pre id="resultado"></pre>
  </div>

  <div class="card">
    <h2>📈 Dashboard</h2>
    <canvas id="grafica"></canvas>
    <p id="totales"></p>
  </div>

</div>

<script>

let chart;

function procesar() {
  fetch('/procesar')
    .then(res => res.json())
    .then(data => {
      document.getElementById('resultado').innerText = data.resultado;
      cargarDashboard();
    });
}

function cargarDashboard() {
  fetch('/dashboard')
    .then(res => res.json())
    .then(data => {

      document.getElementById('totales').innerText =
        "Órdenes: " + data.ordenes + " | Ventas: $" + data.ventas;

      if (chart) chart.destroy();

      chart = new Chart(document.getElementById('grafica'), {
        type: 'bar',
        data: {
          labels: ['Ventas'],
          datasets: [{
            label: 'Total vendido',
            data: [data.ventas]
          }]
        }
      });

    });
}

// auto cargar
cargarDashboard();

</script>

</body>
</html>
